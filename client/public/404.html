<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Redirecting to Strategist Toolbox</title>
    <script>
      // GitHub Pages only serves physical files. Preserve a requested SPA route,
      // then send it through the custom-domain root so index.html can restore it.
      (function () {
        var location = window.location;
        var appRoute = location.pathname.slice(1);
        var query = location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "";
        location.replace(location.protocol + "//" + location.host + "/?/" + appRoute + query + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Strategist Toolbox…</p>
  </body>
</html>
