<html lang="en">

    <meta charset="UTF-8" />

    <title>Strategist Toolbox | Adster Creative</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/manus-storage/adster-toolbox-favicon-32x32_e9f7d4f8.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA fallback: restore the nested route preserved by 404.html
      // before Wouter starts so a refresh returns to the requested module.
      (function (location) {
        if (location.search[1] !== "/") return;
        var route = location.search.slice(1).split("&").map(function (part) {
          return part.replace(/~and~/g, "&");
        }).join("?");
        window.history.replaceState(null, "", route + location.hash);
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
